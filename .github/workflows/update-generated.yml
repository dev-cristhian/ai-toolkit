name: Update generated files

# Regenerates catalog.json (own items), README.md sections and site/ from
# the sources, then commits the result. Commits pushed with GITHUB_TOKEN do
# not trigger new workflow runs, so this cannot loop; the actor check below
# is an extra guard. pages.yml deploys after this workflow completes.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-generated
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Commit generated files
        run: |
          git add README.md catalog.json site/data.json site/index.html
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated files"
          git push
